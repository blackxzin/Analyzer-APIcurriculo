spring:
  application:
    name: cv-analyzer-api
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  version: test
  jwt:
    # Segredo exclusivo da suite de testes. Nao vale em lugar nenhum alem daqui.
    secret: segredo-apenas-para-testes-com-mais-de-32-caracteres
    expiration: 1h
    issuer: cv-analyzer-api
  resume:
    max-file-size-bytes: 10485760
    max-pages: 20
    min-text-length: 50
    allowed-content-types:
      - application/pdf
      - application/x-pdf

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
