spring:
  application:
    name: cv-analyzer-api

  datasource:
    # Nada de senha no codigo. Lemos de variavel de ambiente,
    # com um default so para desenvolvimento local (o mesmo do docker-compose).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cvanalyzer}
    username: ${DB_USERNAME:cvanalyzer}
    password: ${DB_PASSWORD:cvanalyzer}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      # `validate`: o Hibernate confere se as entidades batem com o schema
      # criado pelo Flyway e falha na subida se divergirem. Quem cria tabela
      # aqui e o Flyway, nunca o Hibernate.
      ddl-auto: validate
    open-in-view: false   # evita consultas ao banco durante a serializacao JSON
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never   # nunca vazar stack trace na resposta HTTP

app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}

  resume:
    # 10 MB: curriculo em PDF que passa disso e quase sempre imagem escaneada.
    max-file-size-bytes: 10485760
    max-pages: 20
    # Menos que isso significa que a extracao nao trouxe conteudo util.
    min-text-length: 50
    allowed-content-types:
      - application/pdf
      - application/x-pdf

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.portfolio.cvanalyzer: DEBUG
